# Nginx in front of the app: HTTPS on 443, passes everything to Node on port 4000.
# Copy to /etc/nginx/sites-available/fvt, link it into sites-enabled, set your
# domain and certificate paths, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name fieldvisit.brac.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fieldvisit.brac.net;

    ssl_certificate     /etc/ssl/certs/fieldvisit.crt;
    ssl_certificate_key /etc/ssl/private/fieldvisit.key;

    # visits can carry photos; voice notes up to 25 MB
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
